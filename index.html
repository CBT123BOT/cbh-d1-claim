<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crypto Bros&amp;Ho's: Claim Your 3D TwiN (D1)</title>
<style>body{font-family:system-ui,sans-serif;background:#0d0f14;color:#eee;margin:0;padding:16px;max-width:760px;margin:auto}h1{font-size:1.4em;color:#f5c542}
.note{background:#1c2130;border-left:4px solid #f5c542;padding:10px;border-radius:6px;font-size:.95em;word-break:break-all}
input{width:100%;box-sizing:border-box;padding:12px;font-size:1em;border-radius:8px;border:1px solid #444;background:#151922;color:#fff;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}.card{background:#171b26;border-radius:10px;padding:10px;text-align:center}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#222}.card b{display:block;margin:6px 0 2px;font-size:.9em}
a.btn{display:block;margin-top:6px;padding:9px;border-radius:7px;text-decoration:none;font-weight:600;font-size:.9em}.v{background:#2a3145;color:#cfe}.c{background:#f5c542;color:#111;font-size:1.05em;padding:12px}.sm{display:block;margin-top:6px;font-size:.75em;color:#8a93a8}
#msg{margin:8px 0;color:#aab}</style></head><body>
<h1>Crypto Bros&amp;Ho's: Claim Your 3D TwiN (D1)</h1>
<div class="note">Offers are 2.22 XRP and end Sat Oct 17, 4:20 PM CT. Real CB&amp;H offers come from <b>rNxAwKP3rdNTfe4ZNw1SntXCfW2U4r2XuB</b> and their IDs start with <b>00081770</b>. Block anything else.</div>
<input id="w" placeholder="Paste your wallet address (r...)" autocomplete="off">
<div id="msg"></div><div class="grid" id="g"></div>
<script>
let D={};const g=document.getElementById('g'),m=document.getElementById('msg'),w=document.getElementById('w');
function show(){const a=w.value.trim();g.innerHTML='';if(!a){m.textContent='';return}const L=D[a];
if(!L){m.textContent='No D1 offers found for this wallet.';return}m.textContent=L.length+' offer(s) for your wallet. Pick the ones you want:';
for(const o of L){const c=document.createElement('div');c.className='card';c.innerHTML=`<img loading="lazy" src="${o.img}" alt=""><b>${o.n}</b><div>Piece #${o.p} · 2.22 XRP</div><a class="btn c" target="_blank" rel="noopener" href="${o.u}">CLAIM (accept offer)</a><a class="sm" target="_blank" rel="noopener" href="https://xrp.cafe/nft/${o.id}">view piece</a>`;g.appendChild(c)}
history.replaceState(null,'','?wallet='+encodeURIComponent(a))}
fetch('offers.json').then(r=>r.json()).then(j=>{D=j;const q=new URLSearchParams(location.search).get('wallet');if(q){w.value=q}show()});w.addEventListener('input',show);
</script></body></html>
